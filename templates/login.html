{% extends "base.html" %}
{% block title %}Login · Attendance Suite{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>🎓 Attendance &amp; Performance Suite</h1>
    <p class="muted">BCA Department — sign in to continue</p>
    <form method="post" class="form">
      <label>Username <input name="username" required autofocus></label>
      <label>Password <input name="password" type="password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="demo-creds">
      <strong>Demo accounts</strong>
      <table class="table compact">
        <tr><td>Admin</td><td><code>admin</code> / <code>admin123</code></td></tr>
        <tr><td>Teacher</td><td><code>anjali</code> / <code>teacher123</code></td></tr>
        <tr><td>Student</td><td><code>vaishnavi</code> / <code>student123</code></td></tr>
      </table>
    </div>
  </div>
</div>
{% endblock %}
